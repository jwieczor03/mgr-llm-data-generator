[project]
name = "monitor-service"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.135.1",
    "httpx==0.28.1",
    "pydantic-settings==2.16.3",
    "uvicorn==0.42.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.13",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: test wymagający izolowanej infrastruktury"]
