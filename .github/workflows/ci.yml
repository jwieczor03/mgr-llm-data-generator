name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend / ${{ matrix.service }}
    # Temporarily disabled while GitHub Actions is blocked by account billing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [application-api, generation-service, validation-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.1'
          python-version: '3.14'
      - name: Install locked dependencies
        run: uv sync --locked --project "services/${{ matrix.service }}"
      - name: Run tests
        run: uv run --locked --project "services/${{ matrix.service }}" pytest "services/${{ matrix.service }}/tests"
  frontend:
    name: Frontend / types and build
    # Temporarily disabled while GitHub Actions is blocked by account billing.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '26'
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web
